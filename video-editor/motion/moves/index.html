<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Move bank</title>
<!-- يُفتح عبر: python3 scripts/35_moves.py — الاختيار ينحفظ بـprofile.json تحت "moves" -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&family=Lalezar&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2EE;--ink:#1B1A17;--mut:#7A766E;--card:#fff;--acc:#D97757;--yes:#2E9E6A;--no:#C8473B;--line:rgba(27,26,23,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151412;--ink:#F2EFE9;--mut:#A39E95;--card:#22201D;--line:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg:#151412;--ink:#F2EFE9;--mut:#A39E95;--card:#22201D;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;padding:24px 16px 120px}
header,.g,h2{max-width:1200px;margin-inline:auto}
h1{font-family:Lalezar,sans-serif;font-weight:400;font-size:42px;margin:0;color:var(--acc)}
header p{color:var(--mut);margin:6px 0 0;font-size:16px;line-height:1.7}
h2{font-family:Lalezar,sans-serif;font-weight:400;font-size:28px;margin-top:34px;margin-bottom:12px}
h2 small{font-family:'IBM Plex Sans Arabic';font-size:14px;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.c{background:var(--card);border-radius:20px;padding:10px 10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.07);border:3px solid transparent;transition:border-color .15s}
.c.on{border-color:var(--yes)} .c.off{border-color:var(--no)} .c.off .v{opacity:.45}
.v{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;cursor:pointer}
video{width:100%;height:100%;display:block;object-fit:cover}
.n{position:absolute;top:10px;right:10px;background:var(--acc);color:#fff;font:900 21px Inter,sans-serif;min-width:42px;height:42px;border-radius:21px;display:grid;place-items:center;padding:0 10px}
.badge{position:absolute;top:10px;left:10px;font-weight:700;font-size:14px;border-radius:12px;padding:4px 10px;color:#fff;display:none}
.on .badge{display:block;background:var(--yes)} .off .badge{display:block;background:var(--no)}
.mac{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:12px;border-radius:10px;padding:3px 9px}
h3{font-family:Lalezar,sans-serif;font-weight:400;font-size:24px;margin:10px 4px 0}
h3 small{font-family:'IBM Plex Sans Arabic';font-size:13px;color:var(--mut)}
.c p{margin:4px;font-size:14.5px;line-height:1.6}
.c p.s{font-size:12px;color:var(--mut)} a{color:var(--acc)}
.btns{display:flex;gap:8px;margin:10px 4px 0}
.btns button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);font:700 15px 'IBM Plex Sans Arabic',sans-serif;border-radius:12px;padding:9px 0;cursor:pointer}
.on .yes{background:var(--yes);color:#fff;border-color:var(--yes)} .off .no{background:var(--no);color:#fff;border-color:var(--no)}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.bar .sum{font-size:15px;line-height:1.5;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bar .sum b{font-family:Inter,sans-serif}
.bar button{flex:none;background:var(--acc);color:#fff;border:0;font:700 17px 'IBM Plex Sans Arabic',sans-serif;border-radius:14px;padding:12px 26px;cursor:pointer}
.ro .bar,.ro .btns,.ro .rw{display:none} .ro{padding-bottom:40px}
.done{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;padding:20px}
.done h1{font-size:48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.acts{display:flex;gap:8px;align-items:center}
.acts select,.acts button{font:600 15px Inter,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
[dir=ltr] body,[dir=ltr] .btns button,[dir=ltr] .bar button{font-family:Inter,system-ui,sans-serif}
[dir=ltr] h1,[dir=ltr] h2,[dir=ltr] h3{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.01em}
[dir=ltr] h1{font-size:38px} [dir=ltr] h2{font-size:24px} [dir=ltr] h3{font-size:19px}
[dir=ltr] .n{right:auto;left:10px} [dir=ltr] .badge{left:auto;right:10px} [dir=ltr] .mac{right:auto;left:10px}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="h1"></h1><div class="acts"><select id="langSel" aria-label="Language"></select><button id="themeBtn" type="button" aria-label="Theme">◐</button></div></div>
  <p id="intro"></p>
  <p class="rw" id="hint"></p>
</header>
<div class="g" id="main"></div>
<h2><span id="h2"></span> <small id="h2s"></small></h2>
<div class="g" id="bonus"></div>
<div class="bar"><div class="sum" id="sum"></div><button id="save"></button></div>
<div class="done" id="done"><div><h1 id="doneH"></h1><p id="doneP"></p></div></div>
<script>
const UI = {
  en: { title: 'Move bank', intro: 'Every video gets its own palette of moves: one family and 3 core moves the whole video revolves around, plus accents for special moments. They change from video to video.<br>Previews use sample colors. In your video the move takes your identity colors, your text and the timing of your voice.',
        hint: 'You do not have to choose anything. But if there is a move you never want, press "No", and if you love one, press "Yes" and it gets priority.',
        h2: 'More from the engine', h2s: 'Arabic-first motion', yes: 'Yes ✓', no: 'No ✗', on: 'Yes', off: 'No', mac: 'Mac', source: 'Source', none: 'Nothing chosen yet', yesL: 'Yes', noL: 'No', save: 'Save', saved: 'Saved ✓',
        back: 'Go back to the chat, your choice is now with Claude.', backOnb: 'Go back to the intro page and carry on. You can close this page.', sep: ', ' },
  fr: { title: 'Banque de mouvements', intro: 'Chaque vidéo reçoit sa propre palette de mouvements : une famille et 3 mouvements de base autour desquels toute la vidéo tourne, plus des accents pour les moments spéciaux. Ils changent d\'une vidéo à l\'autre.<br>Les aperçus utilisent des couleurs d\'exemple. Dans votre vidéo, le mouvement prend les couleurs de votre identité, votre texte et le rythme de votre voix.',
        hint: 'Vous n\'avez rien à choisir. Mais si un mouvement ne vous plaît jamais, appuyez sur « Non » ; si vous en aimez un, appuyez sur « Oui » et il passe en priorité.',
        h2: 'En plus du moteur', h2s: 'mouvements pensés pour l\'arabe', yes: 'Oui ✓', no: 'Non ✗', on: 'Oui', off: 'Non', mac: 'Mac', source: 'Source', none: 'Rien de choisi pour l\'instant', yesL: 'Oui', noL: 'Non', save: 'Enregistrer', saved: 'Enregistré ✓',
        back: 'Retournez dans le chat, votre choix est maintenant chez Claude.', backOnb: 'Retournez à la page d\'accueil et continuez. Vous pouvez fermer cette page.', sep: ', ' },
  ar: { title: 'بنك الحركات', intro: 'كل فيديو يطلع بلوحة حركات خاصة فيه: عائلة وحدة و3 حركات أساسية يدور حولها الفيديو، ولهجة للحظات الخاصة. وما تتكرر من فيديو لفيديو.<br>المعاينات بألوان مثال. بفيديوك الحركة تطلع بألوان هويتك ونصك وتوقيت كلامك.',
        hint: 'ما يحتاج تختار شي. بس لو فيه حركة ما تبيها أبد اضغط «لا»، ولو فيه وحدة تحبها اضغط «أبي» وتنقدّم بالاختيار.',
        h2: 'زيادة من المحرّك', h2s: 'حركات عربية خالصة', yes: 'أبي ✓', no: 'لا ✗', on: 'أبي', off: 'لا', mac: 'ماك', source: 'المصدر', none: 'ما اخترت شي للحين', yesL: 'أبي', noL: 'لا', save: 'احفظ', saved: 'انحفظ ✓',
        back: 'ارجع للمحادثة، اختيارك صار عند كلود.', backOnb: 'ارجع لصفحة التعارف وكمّل. تقدر تسكّر هالصفحة.', sep: '، ' }
};
const NAMES = { en: 'English', fr: 'Français', ar: 'العربية' };
const qs = new URLSearchParams(location.search);
let LANG = 'en';
try { const q = qs.get('lang'); const st = localStorage.getItem('vae-moves-lang'); LANG = UI[q] ? q : (UI[st] ? st : 'en'); } catch (e) { const q = qs.get('lang'); if (UI[q]) LANG = q; }
const state = {}; let CAT = [];
const T = k => (UI[LANG] || UI.en)[k];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const tx = (m, f) => { const i = m.i18n && m.i18n[LANG]; return (i && i[f]) || m[f] || ''; };      // Arabic is the source: used when a translation is missing
function card(m) {
  const el = document.createElement('article'); el.className = 'c'; el.dataset.id = m.id; el.dataset.n = m.n; paintCard(el, m); return el;
}
function paintCard(el, m) {
  const src = m.source.url ? `${esc(T('source'))}: <a href="${esc(m.source.url)}" target="_blank" rel="noopener">${esc(m.source.label)}</a>` : `${esc(T('source'))}: ${esc(m.source.label)}`;
  el.innerHTML = `<div class="v"><video src="${esc(m.preview)}" autoplay muted loop playsinline preload="metadata"></video><b class="n">${m.n}</b><span class="badge"></span>${m.mac ? '<span class="mac">' + esc(T('mac')) + '</span>' : ''}</div>
    <h3>${esc(tx(m, 'name'))} <small>${esc(tx(m, 'sub'))}</small></h3><p>${esc(tx(m, 'desc'))}</p><p class="s">${src}</p>
    <div class="btns"><button class="yes">${esc(T('yes'))}</button><button class="no">${esc(T('no'))}</button></div>`;
  el.querySelector('.yes').onclick = () => set(m.id, state[m.id] === 'on' ? null : 'on');
  el.querySelector('.no').onclick = () => set(m.id, state[m.id] === 'off' ? null : 'off');
  el.querySelector('.v').onclick = () => set(m.id, state[m.id] === 'on' ? 'off' : state[m.id] === 'off' ? null : 'on');
}
function set(id, v) { if (v) state[id] = v; else delete state[id]; paint(); }
function paint() {
  document.querySelectorAll('.c').forEach(el => { const v = state[el.dataset.id]; el.classList.toggle('on', v === 'on'); el.classList.toggle('off', v === 'off');
    el.querySelector('.badge').textContent = v === 'on' ? T('on') : v === 'off' ? T('off') : ''; });
  const by = s => CAT.filter(m => state[m.id] === s).map(m => m.n);
  const on = by('on'), off = by('off');
  document.getElementById('sum').innerHTML = on.length || off.length
    ? `${on.length ? T('yesL') + ': <b>' + on.join(T('sep')) + '</b>' : ''}${on.length && off.length ? ' · ' : ''}${off.length ? T('noL') + ': <b>' + off.join(T('sep')) + '</b>' : ''}`
    : T('none');
}
function applyLang(c) {
  LANG = UI[c] ? c : 'en'; try { localStorage.setItem('vae-moves-lang', LANG); } catch (e) {}
  const h = document.documentElement; h.lang = LANG; h.dir = LANG === 'ar' ? 'rtl' : 'ltr'; document.title = T('title');
  document.getElementById('h1').textContent = T('title'); document.getElementById('intro').innerHTML = T('intro'); document.getElementById('hint').textContent = T('hint');
  document.getElementById('h2').textContent = T('h2'); document.getElementById('h2s').textContent = T('h2s');
  document.getElementById('save').textContent = T('save'); document.getElementById('doneH').textContent = T('saved');
  document.getElementById('doneP').textContent = qs.get('from') === 'onboard' ? T('backOnb') : T('back');
  document.getElementById('langSel').value = LANG;
  document.querySelectorAll('.c').forEach(el => paintCard(el, CAT.find(m => m.id === el.dataset.id)));
  paint();
}
document.getElementById('save').onclick = async () => {
  const pickIds = s => CAT.filter(m => state[m.id] === s).map(m => m.id);
  const r = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ on: pickIds('on'), off: pickIds('off') }) });
  if (r.ok) document.getElementById('done').style.display = 'grid';
};
document.getElementById('themeBtn').onclick = () => { const r = document.documentElement; const dark = (r.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')) === 'dark'; r.dataset.theme = dark ? 'light' : 'dark'; };
(async () => {
  const sel = document.getElementById('langSel'); Object.keys(NAMES).forEach(k => sel.add(new Option(NAMES[k], k))); sel.onchange = () => applyLang(sel.value);
  CAT = (await (await fetch('catalog.json')).json()).moves;
  let saved = null; try { saved = localStorage.getItem('vae-moves-lang'); } catch (e) {}
  try { const r = await fetch('/api/state'); if (!r.ok) throw 0; const st = await r.json();
    (st.moves.on || []).forEach(id => state[id] = 'on'); (st.moves.off || []).forEach(id => state[id] = 'off');
    if (!qs.get('lang') && !saved && UI[st.lang]) LANG = st.lang;
    if (st.colors && /^#[0-9a-f]{6}$/i.test(st.colors.acc || '')) document.documentElement.style.setProperty('--acc', st.colors.acc);
  } catch (e) { document.body.classList.add('ro'); }       // opened from the intro page: browse only, no choosing
  CAT.forEach(m => document.getElementById(m.bonus ? 'bonus' : 'main').appendChild(card(m)));
  applyLang(LANG);
})();
</script>
</body>
</html>
